[project]
name = "reidom-runtime-host"
version = "0.1.0"
description = "Product host that connects Ardour-facing APIs to ai-framework Runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.scripts]
reidom-runtime-host = "reidom_runtime_host.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reidom_runtime_host"]

